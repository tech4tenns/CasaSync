
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CasaSync - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d6efd, #4dabf7);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 55px;
        }

        .logo h1 {
            color: #0d6efd;
            font-size: 32px;
            margin-top: 5px;
        }

        .logo p {
            color: #777;
            margin-top: 5px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #0d6efd;
        }

        .eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 19px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 22px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember input {
            accent-color: #0d6efd;
        }

        .forgot {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0957c9;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #ddd;
        }

        .google-btn {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #444;
        }

        .google-btn:hover {
            background: #f7f7f7;
        }

        .create-account {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #666;
        }

        .create-account a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 480px) {

            .login-container {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .logo h1 {
                font-size: 28px;
            }

            .logo-icon {
                font-size: 45px;
            }

        }

    </style>
</head>


<body>

    <div class="login-container">

        <div class="logo">

            <div class="logo-icon">🏠</div>

            <h1>CasaSync</h1>

            <p>
                Organize sua casa. Compita. Conquiste.
            </p>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    📧 E-mail
                </label>

                <div class="input-box">

                    <input
                        type="text"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="password">
                    🔒 Senha
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                    >

                    <span
                        class="eye"
                        id="togglePassword"
                    >
                        👁️
                    </span>

                </div>

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Lembrar de mim

                </label>


                <a href="#" class="forgot">
                    🔑 Esqueci minha senha
                </a>

            </div>


    <button
    type="button"
    class="login-btn"
    onclick="fazerLogin()"
>
    Entrar
</button>

        </form>


        <div class="divider">
            ou
        </div>


        <button
            class="google-btn"
            onclick="googleLogin()"
        >
            🌐 Continuar com Google
        </button>


        <div class="create-account">

            Ainda não tem uma conta?

            <a href="#">
                📝 Criar conta
            </a>

        </div>

    </div>

<script src="script.js"></script>
