<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - CasaSync</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            background: linear-gradient(135deg, #eef6ff, #f8fbff);
            color: #1e293b;
            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            width: 100%;
            min-height: 72px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 7%;

            box-shadow:
                0 4px 15px rgba(37, 99, 235, 0.25);

        }


        .logo {

            color: white;
            font-size: 28px;
            font-weight: bold;

        }


        .logo span {

            color: #bfdbfe;

        }


        .voltar {

            text-decoration: none;

            color: #2563eb;

            background: white;

            padding: 10px 18px;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.25s;

        }


        .voltar:hover {

            transform: translateY(-2px);

            background: #eff6ff;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 90%;
            max-width: 1000px;

            margin: 40px auto;

        }


        .titulo {

            text-align: center;

            color: #17365d;

            font-size: 36px;

            margin-bottom: 10px;

        }


        .subtitulo {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;

        }


        /* =========================
           PERFIL PRINCIPAL
        ========================= */

        .perfil-card {

            background: white;

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(30, 64, 175, 0.10);

            border: 2px solid #dbeafe;

            display: flex;

            align-items: center;

            gap: 30px;

            margin-bottom: 25px;

        }


        /* FOTO */

        .foto {

            width: 150px;
            height: 150px;

            border-radius: 50%;

            background: #e8f3ff;

            border: 5px solid #2563eb;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            flex-shrink: 0;

        }


        .foto img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;

        }


        .avatar-padrao {

            font-size: 70px;

        }


        /* INFORMAÇÕES */

        .informacoes {

            flex: 1;

        }


        .nome {

            font-size: 32px;

            font-weight: bold;

            color: #17365d;

            margin-bottom: 8px;

        }


        .nivel {

            display: inline-block;

            background: #dbeafe;

            color: #2563eb;

            padding: 8px 13px;

            border-radius: 10px;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .xp-texto {

            color: #64748b;

            margin-bottom: 10px;

        }


        /* =========================
           BARRA DE XP
        ========================= */

        .barra-fundo {

            width: 100%;

            height: 14px;

            background: #e2e8f0;

            border-radius: 20px;

            overflow: hidden;

        }


        .barra-xp {

            height: 100%;

            width: 0%;

            background: linear-gradient(
                90deg,
                #2563eb,
                #60a5fa
            );

            border-radius: 20px;

            transition: width 0.5s;

        }


        .texto-barra {

            margin-top: 7px;

            font-size: 13px;

            color: #64748b;

        }


        /* =========================
           BOTÃO FOTO
        ========================= */

        .botao-foto {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 18px;

            background: #5297ff;

            color: white;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;

        }


        .botao-foto:hover {

            background: #2873d5;

            transform: translateY(-2px);

        }


        /* =========================
           BOTÃO NOME
        ========================= */

        .botao-nome {

            margin-top: 12px;

            padding: 9px 15px;

            border: none;

            background: #eff6ff;

            color: #2563eb;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

        }


        .botao-nome:hover {

            background: #dbeafe;

        }


        /* =========================
           ESTATÍSTICAS
        ========================= */

        .estatisticas {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 30px;

        }


        .estatistica {

            background: white;

            border: 2px solid #dbeafe;

            border-radius: 16px;

            padding: 20px;

            text-align: center;

            box-shadow:
                0 6px 18px rgba(30, 64, 175, 0.08);

        }


        .estatistica .icone {

            font-size: 30px;

            margin-bottom: 7px;

        }


        .estatistica h3 {

            font-size: 25px;

            color: #2563eb;

        }


        .estatistica p {

            color: #64748b;

            font-size: 13px;

            margin-top: 4px;

        }


        /* =========================
           TÍTULO CONQUISTAS
        ========================= */

        .titulo-conquistas {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;

        }


        .titulo-conquistas h2 {

            color: #17365d;

        }


        .contador {

            background: #dbeafe;

            color: #2563eb;

            padding: 7px 13px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

        }


        /* =========================
           CONQUISTAS
        ========================= */

        .conquistas {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;

        }


        .conquista {

            background: white;

            border: 2px solid #dbeafe;

            border-radius: 17px;

            padding: 18px;

            display: flex;

            align-items: center;

            gap: 14px;

            box-shadow:
                0 6px 18px rgba(30, 64, 175, 0.07);

            transition: 0.25s;

        }


        .conquista:hover {

            transform: translateY(-3px);

            box-shadow:
                0 9px 22px rgba(30, 64, 175, 0.12);

        }


        .icone-conquista {

            width: 60px;
            height: 60px;

            border-radius: 15px;

            background: #dbeafe;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 30px;

            flex-shrink: 0;

        }


        .conquista h3 {

            color: #17365d;

            font-size: 16px;

            margin-bottom: 5px;

        }


        .conquista p {

            color: #64748b;

            font-size: 12px;

        }


        .vazia {

            background: white;

            border: 2px dashed #bfdbfe;

            border-radius: 17px;

            padding: 30px;

            text-align: center;

            color: #64748b;

            line-height: 1.7;

            grid-column: 1 / -1;

        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 14px 5%;

            }


            .logo {

                font-size: 23px;

            }


            .voltar {

                padding: 9px 12px;

                font-size: 13px;

            }


            .container {

                width: 94%;

                margin: 25px auto;

            }


            .titulo {

                font-size: 29px;

            }


            .perfil-card {

                flex-direction: column;

                text-align: center;

                padding: 25px 18px;

            }


            .foto {

                width: 130px;
                height: 130px;

            }


            .informacoes {

                width: 100%;

            }


            .nome {

                font-size: 26px;

            }


            .estatisticas {

                grid-template-columns: 1fr;

            }


            .conquistas {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">

            Casa<span>Sync</span>

        </div>


        <a
            href="home.html"
            class="voltar"
        >

            🏠 Voltar para Home

        </a>

    </header>



    <!-- =========================
         CONTEÚDO
    ========================= -->

    <main class="container">


        <h1 class="titulo">

            👤 Meu Perfil

        </h1>


        <p class="subtitulo">

            Veja seu progresso e suas conquistas!

        </p>



        <!-- =========================
             PERFIL
        ========================= -->

        <section class="perfil-card">


            <div>


                <div
                    class="foto"
                    id="fotoPerfil"
                >

                    <span
                        id="avatarPadrao"
                        class="avatar-padrao"
                    >

                        👤

                    </span>


                    <img
                        id="imagemPerfil"
                        src=""
                        alt="Foto de perfil"
                    >

                </div>


                <label
                    class="botao-foto"
                    for="inputFoto"
                >

                    📷 Escolher foto

                </label>


                <input
                    type="file"
                    id="inputFoto"
                    accept=".png,.jpg,.jpeg,image/png,image/jpeg"
                    hidden
                >

            </div>



            <div class="informacoes">


                <div
                    class="nome"
                    id="nomePerfil"
                >

                    Seu Nome

                </div>


                <div
                    class="nivel"
                    id="nivelPerfil"
                >

                    ⭐ Nível 1

                </div>


                <div
                    class="xp-texto"
                    id="textoXP"
                >

                    0 XP

                </div>


                <div class="barra-fundo">

                    <div
                        class="barra-xp"
                        id="barraXP"
                    ></div>

                </div>


                <div
                    class="texto-barra"
                    id="textoBarra"
                >

                    0 XP até o próximo nível

                </div>


                <button
                    class="botao-nome"
                    onclick="trocarNome()"
                >

                    ✏️ Alterar nome

                </button>


            </div>

        </section>



        <!-- =========================
             ESTATÍSTICAS
        ========================= -->

        <section class="estatisticas">


            <div class="estatistica">

                <div class="icone">
                    ⭐
                </div>

                <h3 id="estatisticaXP">
                    0
                </h3>

                <p>
                    XP total
                </p>

            </div>


            <div class="estatistica">

                <div class="icone">
                    🏆
                </div>

                <h3 id="estatisticaConquistas">
                    0
                </h3>

                <p>
                    Conquistas
                </p>

            </div>


            <div class="estatistica">

                <div class="icone">
                    🏅
                </div>

                <h3 id="estatisticaNivel">
                    1
                </h3>

                <p>
                    Nível atual
                </p>

            </div>


        </section>



        <!-- =========================
             CONQUISTAS
        ========================= -->

        <div class="titulo-conquistas">


            <h2>

                🏆 Minhas Conquistas

            </h2>


            <div
                class="contador"
                id="contadorConquistas"
            >

                0 / 20

            </div>


        </div>


        <section
            class="conquistas"
            id="conquistasPerfil"
        ></section>


    </main>



    <script src="xp.js"></script>
    <script>


        /* ==========================================
           DADOS
        ========================================== */


        let nomeSalvo =
            localStorage.getItem("casasyncNome")
            || "Seu Nome";


        let xp =
            parseInt(
                localStorage.getItem("casasyncXP")
            ) || 0;


        const fotoSalva =
            localStorage.getItem("casasyncFoto");



        /* ==========================================
           TODAS AS CONQUISTAS
        ========================================== */


        const conquistas = [

            {
                nome: "Primeiro Passo",
                descricao: "Alcance 10 XP.",
                icone: "👣",
                xp: 10
            },

            {
                nome: "Casa Começando",
                descricao: "Alcance 25 XP.",
                icone: "🏠",
                xp: 25
            },

            {
                nome: "Organizador",
                descricao: "Alcance 50 XP.",
                icone: "🧹",
                xp: 50
            },

            {
                nome: "Casa em Ordem",
                descricao: "Alcance 75 XP.",
                icone: "✨",
                xp: 75
            },

            {
                nome: "Mão na Massa",
                descricao: "Alcance 100 XP.",
                icone: "💪",
                xp: 100
            },

            {
                nome: "Dedicado",
                descricao: "Alcance 150 XP.",
                icone: "🔥",
                xp: 150
            },

            {
                nome: "Super Organizador",
                descricao: "Alcance 200 XP.",
                icone: "🦸",
                xp: 200
            },

            {
                nome: "Especialista",
                descricao: "Alcance 250 XP.",
                icone: "🎯",
                xp: 250
            },

            {
                nome: "Mestre da Limpeza",
                descricao: "Alcance 300 XP.",
                icone: "🧽",
                xp: 300
            },

            {
                nome: "Casa Brilhando",
                descricao: "Alcance 350 XP.",
                icone: "💎",
                xp: 350
            },

            {
                nome: "Imparável",
                descricao: "Alcance 400 XP.",
                icone: "🚀",
                xp: 400
            },

            {
                nome: "Craque da Casa",
                descricao: "Alcance 450 XP.",
                icone: "⭐",
                xp: 450
            },

            {
                nome: "Mestre da Organização",
                descricao: "Alcance 500 XP.",
                icone: "👑",
                xp: 500
            },

            {
                nome: "Lenda",
                descricao: "Alcance 600 XP.",
                icone: "🏅",
                xp: 600
            },

            {
                nome: "Casa Perfeita",
                descricao: "Alcance 700 XP.",
                icone: "🏡",
                xp: 700
            },

            {
                nome: "Super Casa",
                descricao: "Alcance 800 XP.",
                icone: "🌟",
                xp: 800
            },

            {
                nome: "Herói da Casa",
                descricao: "Alcance 900 XP.",
                icone: "🦸‍♂️",
                xp: 900
            },

            {
                nome: "Mestre Supremo",
                descricao: "Alcance 1000 XP.",
                icone: "🏆",
                xp: 1000
            },

            {
                nome: "Lenda do CasaSync",
                descricao: "Alcance 1500 XP.",
                icone: "💫",
                xp: 1500
            },

            {
                nome: "Rei da Organização",
                descricao: "Alcance 2000 XP.",
                icone: "👑",
                xp: 2000
            }

        ];



        /* ==========================================
           NÍVEL
        ========================================== */


        function descobrirNivel(xp) {
            return CasaSyncXP.nivelDe(xp);
        }

        /* ==========================================
           ATUALIZAR PERFIL
        ========================================== */

        function atualizarPerfil() {

            const i = CasaSyncXP.info(xp);

            document.getElementById("nomePerfil").textContent = nomeSalvo;
            document.getElementById("nivelPerfil").textContent = "⭐ Nível " + i.nivel;
            document.getElementById("textoXP").textContent = xp + " XP";
            document.getElementById("estatisticaXP").textContent = xp;
            document.getElementById("estatisticaNivel").textContent = i.nivel;
            document.getElementById("barraXP").style.width = i.porcentagem + "%";

            document.getElementById("textoBarra").textContent =
                i.maximo
                ? "🎉 Você alcançou o nível máximo!"
                : i.faltam + " XP até o nível " + i.proximoNivel;
        }


        /* ==========================================
           MOSTRAR FOTO
        ========================================== */


        function atualizarFoto() {


            const imagem =
                document.getElementById(
                    "imagemPerfil"
                );


            const avatar =
                document.getElementById(
                    "avatarPadrao"
                );


            const foto =
                localStorage.getItem(
                    "casasyncFoto"
                );


            if (foto) {

                imagem.src = foto;

                imagem.style.display =
                    "block";

                avatar.style.display =
                    "none";

            }

            else {

                imagem.style.display =
                    "none";

                avatar.style.display =
                    "block";

            }

        }



        /* ==========================================
           MOSTRAR CONQUISTAS
        ========================================== */


        function mostrarConquistas() {


            const area =
                document.getElementById(
                    "conquistasPerfil"
                );


            area.innerHTML = "";


            const desbloqueadas =
                conquistas.filter(
                    function(conquista) {

                        return xp >= conquista.xp;

                    }
                );


            document.getElementById(
                "estatisticaConquistas"
            ).textContent =
                desbloqueadas.length;


            document.getElementById(
                "contadorConquistas"
            ).textContent =
                desbloqueadas.length +
                " / " +
                conquistas.length;



            /* =========================
               NENHUMA
            ========================= */


            if (desbloqueadas.length === 0) {


                area.innerHTML = `

                    <div class="vazia">

                        🏆

                        <br><br>

                        Você ainda não desbloqueou
                        nenhuma conquista.

                        <br>

                        Complete tarefas para
                        começar a ganhar XP!

                    </div>

                `;


                return;

            }



            /* =========================
               CARDS
            ========================= */


            desbloqueadas.forEach(
                function(conquista) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "conquista";


                    card.innerHTML = `

                        <div
                            class="icone-conquista"
                        >

                            ${conquista.icone}

                        </div>


                        <div>

                            <h3>
                                ${conquista.nome}
                            </h3>


                            <p>
                                ${conquista.descricao}
                            </p>

                        </div>

                    `;


                    area.appendChild(card);

                }
            );

        }



        /* ==========================================
           ALTERAR NOME
        ========================================== */


        function trocarNome() {


            const novoNome =
                prompt(
                    "Digite seu novo nome:"
                );


            if (
                novoNome &&
                novoNome.trim() !== ""
            ) {


                nomeSalvo =
                    novoNome.trim();


                localStorage.setItem(
                    "casasyncNome",
                    nomeSalvo
                );


                atualizarPerfil();

            }

        }



        /* ==========================================
           ESCOLHER FOTO
        ========================================== */


        const inputFoto =
            document.getElementById(
                "inputFoto"
            );


        inputFoto.addEventListener(
            "change",
            function() {


                const arquivo =
                    this.files[0];


                if (!arquivo) return;



                /* TIPOS PERMITIDOS */


                if (
                    arquivo.type !==
                    "image/png" &&

                    arquivo.type !==
                    "image/jpeg"
                ) {


                    alert(
                        "❌ Escolha uma imagem PNG, JPG ou JPEG."
                    );


                    inputFoto.value = "";


                    return;

                }



                /* TAMANHO */


                if (
                    arquivo.size >
                    5 * 1024 * 1024
                ) {


                    alert(
                        "❌ A imagem deve ter no máximo 5 MB."
                    );


                    inputFoto.value = "";


                    return;

                }



                const leitor =
                    new FileReader();


                leitor.onload =
                    function(event) {


                        const imagem =
                            event.target.result;


                        localStorage.setItem(
                            "casasyncFoto",
                            imagem
                        );


                        atualizarFoto();


                    };


                leitor.readAsDataURL(
                    arquivo
                );

            }
        );



        /* ==========================================
           INICIAR
        ========================================== */


        atualizarPerfil();

        atualizarFoto();

        mostrarConquistas();



        /* ==========================================
           ATUALIZAR SE O XP MUDAR
        ========================================== */


        window.addEventListener(
            "storage",
            function(event) {


                if (
                    event.key ===
                    "casasyncXP"
                ) {


                    xp =
                        parseInt(
                            localStorage.getItem(
                                "casasyncXP"
                            )
                        ) || 0;


                    atualizarPerfil();

                    mostrarConquistas();

                }


                if (
                    event.key ===
                    "casasyncNome"
                ) {


                    nomeSalvo =
                        localStorage.getItem(
                            "casasyncNome"
                        ) || "Seu Nome";


                    atualizarPerfil();

                }


                if (
                    event.key ===
                    "casasyncFoto"
                ) {


                    atualizarFoto();

                }

            }
        );


    </script>

</body>

</html>
